name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o zip
        run: unzip -q DLSReal-projeto-v4.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        working-directory: DLSReal
        run: gradle assembleDebug

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp DLSReal/app/build/outputs/apk/debug/app-debug.apk DLSReal.apk
          gh release create "v${{ github.run_number }}" DLSReal.apk --title "DLS Real build ${{ github.run_number }}" --notes "APK debug"
